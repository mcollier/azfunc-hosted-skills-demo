name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q src

      - name: Lint
        run: |
          pip install 'ruff==0.17.3'
          ruff check --output-format=github src

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  agents:
    name: Agent definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate YAML front matter and config
        run: |
          pip install pyyaml
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []

          for path in sorted(pathlib.Path("src").rglob("*.agent.md")) + sorted(
              pathlib.Path("src").rglob("SKILL.md")
          ):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  failures.append(f"{path}: missing YAML front matter")
                  continue
              _, front_matter, _ = text.split("---", 2)
              try:
                  data = yaml.safe_load(front_matter) or {}
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: invalid YAML ({exc})")
                  continue
              for key in ("name", "description"):
                  if not data.get(key):
                      failures.append(f"{path}: front matter missing '{key}'")

          for path in ("src/agents.config.yaml",):
              try:
                  yaml.safe_load(pathlib.Path(path).read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: invalid YAML ({exc})")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("All agent and skill definitions are valid.")
          PY
